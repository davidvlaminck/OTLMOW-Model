[build-system]
requires = [ "setuptools", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "otlmow_model"
version = "2.21.0.2"
readme = "README.md"
classifiers = [ "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Operating System :: OS Independent", "Development Status :: 5 - Production/Stable", "Environment :: Console", "Intended Audience :: Developers", "Intended Audience :: Information Technology", "License :: OSI Approved :: GNU General Public License v3 (GPLv3)", "Natural Language :: Dutch", "Topic :: Software Development", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Software Development :: Quality Assurance",]
requires-python = ">=3.9"
dependencies = []
[[project.authors]]
name = "David Vlaminck"
email = "david.vlaminck@mow.vlaanderen.be"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/davidvlaminck/OTLMOW-Model"
"Bug Tracker" = "https://github.com/davidvlaminck/OTLMOW-Model/issues"

[project.optional-dependencies]
test = [ "pytest", "pytest-cov", "pytest-subtests", "pytest-timeout", "nbmake",]
update = [ "otlmow_modelbuilder", "toml",]

[tool.ruff]
line-length = 120
target-version = "py39"
src = [ "otlmow_model", "UnitTests", "model_update",]
extend-exclude = [ "UnitTests/TestModel", "otlmow_model/OtlmowModel/Classes", "otlmow_model/OtlmowModel/Datatypes", "otlmow_model/OtlmowModel/Helpers/all_classes.py",]

[tool.mypy]
python_version = "3.9"
mypy_path = [ ".", "code_quality/scripts",]
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
exclude = "otlmow_model/OtlmowModel/(Classes|Datatypes)/"
[[tool.mypy.overrides]]
module = [ "otlmow_model.*",]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [ "otlmow_model.OtlmowModel.Classes.*", "otlmow_model.OtlmowModel.Datatypes.*", "otlmow_model.OtlmowModel.Helpers.all_classes", "UnitTests.TestModel.*",]
follow_imports = "skip"
ignore_errors = true

[tool.setuptools.package-data]
"*" = [ "generated_info.json",]

[tool.pytest.ini_options]
testpaths = [ "UnitTests",]
addopts = "-ra"

[tool.ruff.lint]
select = [ "E", "F", "I", "B", "C4", "UP", "PYI", "PT", "RUF", "S", "BLE", "TRY", "FLY", "A", "C", "PL", "Q", "RET", "N", "W", "T20", "G", "LOG", "PIE", "SIM", "PERF", "ARG", "TID", "PTH",]
ignore = [ "E501",]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.setuptools.packages.find]
include = [ "otlmow_model*",]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"otlmow_model/OtlmowModel/**/*.py" = [ "N802", "N803", "N815", "N806", "TID252",]
"UnitTests/**" = [ "S101", "N802", "N803", "N815", "PLR2004", "PT006", "PT011",]
"model_update/**" = [ "T201", "S603", "S607",]
"code_quality/scripts/*.py" = [ "T201", "S603",]
