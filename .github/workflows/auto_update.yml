name: Automatic update
run-name: Automatic update of class model
on:
  schedule:
    - cron: "17 20 * * *" # every day at 8:17pm UTC. GitHub's schedule queue is best-effort and can delay this by several hours; with the drift this repo sees (~4-6h) it lands around night in CET. For guaranteed timing, trigger via `gh workflow run` (workflow_dispatch is available).
  workflow_dispatch:

jobs:
  auto_update:
    name: Creating an automatic update for the class model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    concurrency: auto_update
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv with Python version 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.13
      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Installing dependencies with uv
        run: |
          uv venv --python 3.13
          uv pip install -r pyproject.toml --extra update
      - name: Run automatic update
        run: uv run python3 automatic_update.py
        working-directory: ./model_update
      - name: Commit files
        working-directory: .
        run: |
          git pull
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "auto updated class model - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit."
          git push
